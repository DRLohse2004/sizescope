<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SizeScope</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="toolbar">
    <div class="brand" title="SizeScope">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="2" width="11" height="20" rx="2" fill="var(--t-video)"/><rect x="14" y="2" width="8" height="11" rx="2" fill="var(--t-doc)"/><rect x="14" y="14" width="8" height="8" rx="2" fill="var(--t-image)"/></svg>
    </div>
    <div class="pathbox">
      <input id="pathInput" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="pathPlaceholder">
      <button id="pickBtn" class="icon-btn" data-i18n-title="pickFolder"></button>
      <button id="driveBtn" class="icon-btn" data-i18n-title="drives"></button>
    </div>
    <button id="scanBtn" class="btn primary"><span data-i18n="scan"></span></button>
    <button id="stopBtn" class="btn" hidden><span data-i18n="stop"></span></button>
    <div class="spacer"></div>
    <button id="exportBtn" class="icon-btn" data-i18n-title="export" disabled></button>
    <button id="adminBtn" class="icon-btn" data-i18n-title="restartAdmin" hidden></button>
    <button id="settingsBtn" class="icon-btn" data-i18n-title="settings"></button>
  </header>

  <section id="welcome" class="welcome">
    <div class="welcome-inner">
      <h1 data-i18n="welcomeTitle"></h1>
      <p class="lead" data-i18n="welcomeLead"></p>
      <div id="driveList" class="drive-list"></div>
      <div id="recentWrap" hidden>
        <h2 data-i18n="recent"></h2>
        <div id="recentList" class="recent-list"></div>
      </div>
    </div>
  </section>

  <section id="workspace" class="workspace" hidden>
    <div class="scanbar">
      <div class="scan-title">
        <strong id="rootName"></strong>
        <span id="scanState" class="scan-state"></span>
      </div>
      <div class="vol" id="volWrap">
        <div class="vol-bar"><span id="volScanned"></span><span id="volOther"></span></div>
        <span id="volText" class="vol-text"></span>
      </div>
    </div>
    <div class="panes" id="panes">
      <div class="tree-pane">
        <div class="tree-head" id="treeHead"></div>
        <div class="tree-scroll" id="treeScroll" tabindex="0">
          <div class="tree-sizer" id="treeSizer"></div>
          <div class="tree-rows" id="treeRows"></div>
        </div>
      </div>
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
      <div class="side-pane">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="map" data-i18n="tabMap"></button>
          <button role="tab" data-tab="types" data-i18n="tabTypes"></button>
          <button role="tab" data-tab="top" data-i18n="tabTop"></button>
          <button role="tab" data-tab="age" data-i18n="tabAge"></button>
        </nav>
        <div class="crumbs" id="crumbs"></div>
        <div class="tab-body">
          <div class="tab-panel" id="panel-map">
            <canvas id="mapCanvas"></canvas>
            <div class="map-legend" id="mapLegend"></div>
          </div>
          <div class="tab-panel scroll" id="panel-types" hidden></div>
          <div class="tab-panel scroll" id="panel-top" hidden></div>
          <div class="tab-panel scroll" id="panel-age" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="statusbar" id="statusbar">
    <span id="stFiles"></span>
    <span id="stDirs"></span>
    <span id="stErrors" class="st-errors" hidden></span>
    <span id="stOnline" class="st-online" hidden></span>
    <span class="spacer"></span>
    <span id="stCurrent" class="st-current"></span>
    <span id="stTime"></span>
  </footer>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="menu" class="menu" hidden role="menu"></div>
<div id="drivePop" class="popover" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="confirmDlg" class="dlg">
  <form method="dialog">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText" class="dlg-text"></p>
    <code id="confirmPath" class="dlg-path"></code>
    <label class="check"><input type="checkbox" id="confirmNoAsk"> <span data-i18n="dontAskAgain"></span></label>
    <div class="dlg-actions">
      <button value="cancel" class="btn" data-i18n="cancel"></button>
      <button value="ok" class="btn danger" id="confirmOk" data-i18n="moveToBin"></button>
    </div>
  </form>
</dialog>

<dialog id="settingsDlg" class="dlg wide">
  <form method="dialog" id="settingsForm">
    <h3 data-i18n="settings"></h3>
    <div class="form-grid">
      <label data-i18n="sLanguage"></label>
      <select name="language"><option value="auto" data-i18n="sAuto"></option><option value="de">Deutsch</option><option value="en">English</option></select>
      <label data-i18n="sTheme"></label>
      <select name="theme"><option value="system" data-i18n="sSystem"></option><option value="light" data-i18n="sLight"></option><option value="dark" data-i18n="sDark"></option></select>
      <label data-i18n="sUnit"></label>
      <select name="unit"><option value="auto" data-i18n="sAuto"></option><option>KB</option><option>MB</option><option>GB</option></select>
      <label data-i18n="sSizeMode"></label>
      <select name="sizeMode"><option value="size" data-i18n="colSize"></option><option value="alloc" data-i18n="colAlloc"></option></select>
      <label data-i18n="sMapColor"></label>
      <select name="mapColor"><option value="type" data-i18n="sByType"></option><option value="depth" data-i18n="sByFolder"></option></select>
      <label data-i18n="sShowFiles"></label>
      <input type="checkbox" name="showFiles">
      <label data-i18n="sTopFiles"></label>
      <input type="number" name="topFiles" min="10" max="5000" step="10">
      <label data-i18n="sExclude"></label>
      <div><textarea name="exclude" rows="3" spellcheck="false"></textarea><small data-i18n="sExcludeHint"></small></div>
      <label data-i18n="sCsvSep"></label>
      <select name="csvSeparator"><option value=";">;</option><option value=",">,</option><option value="tab">Tab</option></select>
      <label data-i18n="sExportDepth"></label>
      <div><input type="number" name="exportDepth" min="0" max="100"><small data-i18n="sExportDepthHint"></small></div>
      <label data-i18n="sExportFiles"></label>
      <input type="checkbox" name="exportFiles">
      <label data-i18n="sConfirmDelete"></label>
      <input type="checkbox" name="confirmDelete">
      <label data-i18n="sOnline"></label>
      <div><select name="onlineFiles"><option value="skip" data-i18n="sOnlineSkip"></option><option value="count" data-i18n="sOnlineCount"></option></select><small data-i18n="sOnlineHint"></small></div>
      <label data-i18n="sCloudFetch"></label>
      <div><input type="checkbox" name="cloudFetch"><small data-i18n="sCloudFetchHint"></small></div>
    </div>
    <p class="about" id="about"></p>
    <div class="dlg-actions">
      <button value="cancel" class="btn" data-i18n="cancel"></button>
      <button value="ok" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<script src="i18n.js"></script>
<script src="treemap.js"></script>
<script src="app.js"></script>
</body>
</html>
