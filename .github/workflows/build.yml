name: build

# Builds SizeScope.exe. A release is created automatically when the version
# in VERSION has no matching tag yet, so releasing means: bump VERSION, push.
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/build.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Read version
        id: ver
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "exists=true"; else echo "exists=false"; fi >> "$GITHUB_OUTPUT"
      - run: go test ./scanner
      - name: Build
        run: |
          v=${{ steps.ver.outputs.version }}
          go install github.com/tc-hib/go-winres@latest
          go-winres make --arch amd64 --product-version $v --file-version $v
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w -X main.appVersion=$v" -o build/bin/SizeScope.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: SizeScope-windows-amd64
          path: build/bin/SizeScope.exe
      - name: Release
        if: steps.ver.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: SizeScope ${{ steps.ver.outputs.version }}
          body_path: .github/release-notes.md
          files: build/bin/SizeScope.exe
