name: release-cleanup

# One-off maintenance: removes all existing releases and tags (they point to
# commits from before the history rewrite) and rebuilds the current release.
# Remove this file once it has run.
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-cleanup.yml]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete releases
        run: |
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            echo "release $t"; gh release delete "$t" --yes
          done
      - name: Delete tags
        run: |
          for t in $(gh api "repos/$GH_REPO/tags" --paginate -q '.[].name'); do
            echo "tag $t"; gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t"
          done
      - name: Rebuild current release
        run: gh workflow run build.yml --ref main
